[project]
name = "xrouter"
version = "0.1.0"
description = "OpenAI-compatible AI intelligence gateway/router: fast, stable, low-cost, recoverable."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
