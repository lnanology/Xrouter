routing:
  default_policy: balanced   # fastest | cheapest | reliable | quota_aware | quality | balanced
  max_fallback_attempts: 3
  race_mode_enabled: false   # optional; off by default to avoid burning free-tier quota
  race_candidate_count: 2    # how many top candidates to race concurrently when race_mode_enabled
                              # is true and a request sets "race": true (non-streaming only)
  quality_gate_enabled: false   # optional; off by default, a failed gate costs an extra provider call
  quality_gate_min_score: 0.5   # response.xrouter.quality.score below this fails the gate
  max_quality_retries: 1        # how many untried candidates to retry through on a failed gate
  max_dag_nodes: 20              # cap on nodes in a single POST /v1/dag/run request
  planner_routing_policy: quality  # routing policy used for the Planner's own planning call
  max_plan_retries: 2              # how many times the Planner re-prompts on an invalid/unrunnable plan
  max_verify_retries: 1            # how many times a failed Verifier check (request "verify": true) triggers a fresh plan+execute cycle
  max_tool_iterations: 3           # call -> tool -> call round-trips a node's XRouter-executed tool use (enable_tools) may take before giving up
  # Phase 2: let the Task Classifier pick a policy per-request (task type +
  # complexity) instead of always using default_policy. A client-supplied
  # routing_policy in the request body always wins over both.
  task_aware_policy: true
