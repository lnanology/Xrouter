# XRouter server + cache settings. Secrets (API keys) never go here — see
# providers.yaml's api_key_env fields and .env.example.

server:
  host: "0.0.0.0"
  port: 20128
  # admin_token: set via XROUTER_ADMIN_TOKEN in .env instead of here.
  cors_origins: ["*"]
  request_timeout_seconds: 60
  max_request_body_bytes: 5000000
  global_concurrency_limit: 64
  per_client_rate_limit_per_minute: 120

cache:
  enabled: true
  l1_max_entries: 512
  default_ttl_seconds: 300
  volatile_keywords:
    - today
    - now
    - current
    - latest
    - news
    - price
    - stock
    - weather

# Automated Benchmark (Phase 5): off by default -- enabling this fires a
# real chat completion against every enabled provider on a timer, so it
# shouldn't turn on silently (same reasoning as routing.race_mode_enabled).
benchmark:
  enabled: false
  interval_seconds: 3600
  prompt: "Reply with the single word: OK"
  max_tokens: 8

# A/B Routing (Phase 5): off by default -- enabling this changes how every
# non-pinned request gets routed, splitting live traffic across the listed
# policy variants (same reasoning as routing.race_mode_enabled).
ab_routing:
  enabled: false
  variants:
    - quality
    - balanced

# Policy Learning (Phase 5): off by default -- enabling this lets the
# router use weights nudged by PolicyLearner.run_once() instead of the
# static defaults in app/routing/policies/*.py (same reasoning as
# ab_routing.enabled). Depends on ab_routing already being enabled and
# trafficked -- with no ab_results data there's nothing to learn from.
policy_learning:
  enabled: false
  min_samples: 20
  learning_rate: 0.15
  min_margin: 0.05
  latency_weight_per_second: 0.05
  quality_weight: 0.1
