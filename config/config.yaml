# XRouter server + cache settings. Secrets (API keys) never go here — see
# providers.yaml's api_key_env fields and .env.example.

server:
  host: "0.0.0.0"
  port: 20128
  # admin_token: set via XROUTER_ADMIN_TOKEN in .env instead of here.
  cors_origins: ["*"]
  request_timeout_seconds: 60
  max_request_body_bytes: 5000000
  global_concurrency_limit: 64
  per_client_rate_limit_per_minute: 120

cache:
  enabled: true
  l1_max_entries: 512
  default_ttl_seconds: 300
  volatile_keywords:
    - today
    - now
    - current
    - latest
    - news
    - price
    - stock
    - weather

# Automated Benchmark (Phase 5): off by default -- enabling this fires a
# real chat completion against every enabled provider on a timer, so it
# shouldn't turn on silently (same reasoning as routing.race_mode_enabled).
benchmark:
  enabled: false
  interval_seconds: 3600
  prompt: "Reply with the single word: OK"
  max_tokens: 8

# A/B Routing (Phase 5): off by default -- enabling this changes how every
# non-pinned request gets routed, splitting live traffic across the listed
# policy variants (same reasoning as routing.race_mode_enabled).
ab_routing:
  enabled: false
  variants:
    - quality
    - balanced

# Policy Learning (Phase 5): off by default -- enabling this lets the
# router use weights nudged by PolicyLearner.run_once() instead of the
# static defaults in app/routing/policies/*.py (same reasoning as
# ab_routing.enabled). Depends on ab_routing already being enabled and
# trafficked -- with no ab_results data there's nothing to learn from.
policy_learning:
  enabled: false
  min_samples: 20
  learning_rate: 0.15
  min_margin: 0.05
  latency_weight_per_second: 0.05
  quality_weight: 0.1

# Evolution Engine (Phase 5): off by default -- runs its own background
# timer (same reasoning as benchmark.enabled), evaluating each prior
# nudge against fresh post-nudge evidence and rolling it back if it made
# things worse, then asking Policy Learning for a new nudge. Depends on
# policy_learning already being enabled -- otherwise nothing it computes
# actually reaches real routing.
evolution:
  enabled: false
  interval_seconds: 3600
  evaluation_samples: 20
  rollback_tolerance: 0.02

# Self-healing (Phase 5, last piece): off by default -- the one background
# task that actually takes provider enable/disable out of human hands.
# Correlates two signals that already exist for free (HealthMonitor's own
# health polling + the circuit breaker's live-traffic state) and
# auto-disables a provider that's looked bad on either for confirm_cycles
# consecutive checks, auto re-enabling it once it's looked good for
# confirm_cycles consecutive checks -- never touching a provider an admin
# disabled directly.
self_healing:
  enabled: false
  interval_seconds: 30
  confirm_cycles: 3

# Embedding-backed Memory retrieval (Tier 1): off by default -- enabling
# this spends a real embed() provider call on every Orchestrator recall
# AND every remember (tier >= 2), on top of what the always-on keyword
# retriever already does for free (same reasoning as quality_gate_enabled).
# The default model needs to actually be pulled in Ollama first:
#   ollama pull nomic-embed-text
# before enabling this, or every embed() call will just fail open (falls
# back to empty retrieval results, never crashes).
retrieval:
  enabled: false
  embedding_provider: ollama
  embedding_model: nomic-embed-text
  max_candidates: 200
